version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_ID}_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/devcal1/ajd-design-manager:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      APP_PASSWORD: $APP_SEED
      SESSION_SECRET: $APP_SEED
      # Scheduled local backups (app/src/backup.js): a VACUUM INTO snapshot of
      # the DB + a copy of uploads, written under data/backups on a timer.
      # That's inside the volume below, so Umbrel's own backup feature picks
      # these up automatically as long as this app's data directory is
      # included in what Umbrel backs up -- no separate wiring needed here.
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION: "14"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
