<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJD — Projects</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css">
</head>
<body class="min-h-screen">
  <header class="px-6 py-4 flex items-center justify-between" style="background:#fff; border-bottom:1px solid var(--line)">
    <span class="font-display text-2xl" style="color:var(--ink)">AJD</span>
    <nav class="flex items-center gap-5 text-sm">
      <a href="/" class="nav-link nav-active" style="color:var(--ink)">Projects</a>
      <a href="/library.html" class="nav-link" style="color:var(--ink-soft)">Library</a>
      <a href="/settings.html" title="Settings" aria-label="Settings" class="text-base leading-none" style="color:var(--ink-soft); opacity:.6">⚙</a>
      <button onclick="logout()" class="btn-ghost px-3 py-1.5 rounded-lg text-sm">Sign out</button>
    </nav>
  </header>
  <main class="p-6 max-w-6xl mx-auto">
    <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
      <div>
        <h1 class="font-display text-3xl mb-1" style="color:var(--ink)">Projects</h1>
        <p class="text-sm" style="color:var(--ink-soft)">Every active job, at a glance.</p>
      </div>
      <button onclick="openForm()" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">+ New project</button>
    </div>
    <div class="flex items-center gap-3 flex-wrap mb-5">
      <input id="search" type="text" placeholder="Search by project or client..."
        class="flex-1 min-w-[220px] border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
      <label class="flex items-center gap-2 text-sm" style="color:var(--ink-soft)">
        <input type="checkbox" id="show-archived"> Show archived
      </label>
    </div>
    <div id="grid" class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))"></div>
    <div id="empty" class="hidden text-center py-16" style="color:var(--ink-soft)">
      <p class="font-display text-xl mb-1" style="color:var(--ink)">No projects yet</p>
      <p class="text-sm mb-4">Create your first project to start tracking it.</p>
      <button onclick="openForm()" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">+ New project</button>
    </div>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeForm()">
    <div class="card modal-body p-6 w-full max-w-lg">
      <h2 class="font-display text-xl mb-4" style="color:var(--ink)">New project</h2>
      <form id="project-form" class="space-y-3">
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Project name *</label>
          <input id="f-name" required class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Client</label>
            <input id="f-client" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Status</label>
            <select id="f-status" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
              <option value="active">Active</option>
              <option value="on hold">On hold</option>
              <option value="complete">Complete</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Budget</label>
          <input id="f-budget" type="number" step="0.01" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Notes</label>
          <textarea id="f-notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)"></textarea>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Cover image</label>
          <input id="f-cover" type="file" accept="image/*" class="w-full text-sm">
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Create project</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/shared.js"></script>
  <script>
    let projects = [];

    function statusLabel(s) {
      return { active: 'Active', 'on hold': 'On hold', complete: 'Complete' }[s] || s;
    }

    async function load() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const includeArchived = document.getElementById('show-archived').checked;
      const all = await api('/api/projects' + (includeArchived ? '?includeArchived=true' : ''));
      projects = q
        ? all.filter(p => (p.name + ' ' + (p.clientName || '')).toLowerCase().includes(q))
        : all;
      render();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      if (!projects.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = projects.map(cardHtml).join('');
    }

    function cardHtml(p) {
      const cover = p.coverImagePath
        ? `<img src="${esc(p.coverImagePath)}" class="lib-thumb" alt="">`
        : `<div class="lib-thumb-placeholder">No image</div>`;
      return `
        <a href="/project.html?id=${p.id}" class="card card-hover overflow-hidden block">
          <div class="rounded-t-[20px] overflow-hidden relative">
            ${cover}
            <span class="tag tag-status absolute top-2 right-2" style="background:#fff">${esc(statusLabel(p.status))}${p.archived ? ' · Archived' : ''}</span>
          </div>
          <div class="p-3">
            <p class="font-semibold text-sm truncate" style="color:var(--ink)" title="${esc(p.name)}">${esc(p.name)}</p>
            <p class="text-xs truncate" style="color:var(--ink-soft)">${esc(p.clientName) || '&nbsp;'}</p>
            ${p.budget != null ? `<p class="text-xs mt-1" style="color:var(--ink-soft)">Budget ${money(p.budget)}</p>` : ''}
          </div>
        </a>`;
    }

    function openForm() {
      document.getElementById('project-form').reset();
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('name', document.getElementById('f-name').value);
      fd.append('clientName', document.getElementById('f-client').value);
      fd.append('status', document.getElementById('f-status').value);
      fd.append('budget', document.getElementById('f-budget').value);
      fd.append('notes', document.getElementById('f-notes').value);
      const file = document.getElementById('f-cover').files[0];
      if (file) fd.append('coverImage', file);

      const res = await fetch('/api/projects', { method: 'POST', body: fd });
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        toast(body.error || 'Save failed');
        return;
      }
      const created = await res.json();
      closeForm();
      window.location.href = `/project.html?id=${created.id}`;
    });

    let searchTimer;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(load, 200);
    });
    document.getElementById('show-archived').addEventListener('change', load);

    load();
  </script>
</body>
</html>
