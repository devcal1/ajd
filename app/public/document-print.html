<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJD — Design Document</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css">
<style>
  @page { size: A4; margin: 18mm 16mm; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .doc-page { box-shadow: none !important; border: none !important; }
    .doc-room { break-inside: auto; }
    .doc-room-head { break-after: avoid; }
    .doc-table tr { break-inside: avoid; }
    thead { display: table-header-group; }
    .doc-page { max-width: none; padding: 0 !important; }
  }
  .doc-page { max-width: 820px; margin: 0 auto; }
  .doc-table th, .doc-table td { padding: .5rem .6rem; text-align: left; vertical-align: top; }
  .doc-table th { font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); border-bottom: 1px solid var(--line); }
  .doc-table td { font-size: .85rem; border-bottom: 1px solid var(--line); }
  .doc-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--paper-2); }
</style>
</head>
<body class="min-h-screen">
  <div class="no-print px-6 py-4 flex items-center justify-between" style="background:#fff; border-bottom:1px solid var(--line)">
    <a id="back-link" href="/" class="text-sm" style="color:var(--ink-soft)">&larr; Back to project</a>
    <button onclick="window.print()" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Print / Save as PDF</button>
  </div>
  <main class="p-3 sm:p-6">
    <div id="content" class="doc-page card p-5 sm:p-8"></div>
  </main>

  <script src="/js/shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const revisionId = params.get('revision');
    // Per-project display settings (set in the project's Edit dialog); filled in by load().
    let S = { showCosts: true, showImages: true, showApproval: true, showDetails: true, showSupplierColumn: true, showSourceLinks: false, headerText: '', grouping: 'room' };
    let bySupplier = false;

    function tableHead(hasImages, withSupplier) {
      return `<thead><tr>${hasImages ? '<th></th>' : ''}<th>Item</th>${withSupplier ? '<th>Supplier</th>' : ''}<th>Spec</th><th>Qty</th>${S.showCosts ? '<th>Cost</th><th>Total</th>' : ''}${S.showApproval ? '<th>Approval</th>' : ''}</tr></thead>`;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function statusLabel(s) {
      return { active: 'Active', 'on hold': 'On hold', complete: 'Complete' }[s] || s;
    }

    function statusLabelSel(s) {
      return { proposed: 'Proposed', approved: 'Approved', rejected: 'Rejected' }[s] || s;
    }

    function selectionRowHtml(sel, showThumb, roomName) {
      const thumb = sel.imagePath
        ? `<img src="${esc(sel.imagePath)}" class="doc-thumb" alt="">`
        : '';
      const spec = [sel.dimensions, sel.finish].filter(Boolean).join(', ');
      // The by-supplier view already groups under the supplier name, so the column is room-view only.
      const withSupplier = S.showSupplierColumn && !roomName;
      const lineTotal = sel.cost != null ? (sel.cost * (sel.qty || 1)) : null;
      const approvalHtml = sel.status === 'approved'
        ? `<span style="color:var(--green); font-weight:600">Approved</span>`
        : `<span style="color:var(--ink-soft)">Awaiting approval</span>`;
      return `
        <tr>
          ${showThumb ? `<td>${thumb}</td>` : ''}
          <td>
            <p style="color:var(--ink)" class="font-semibold">${esc(sel.title)}</p>
            ${S.showSourceLinks && sel.sourceUrl ? `<p class="text-xs"><a href="${esc(sel.sourceUrl)}" style="color:var(--ink-soft); text-decoration:underline">View product</a></p>` : ''}
            <p style="color:var(--ink-soft)" class="text-xs">${esc((roomName ? [roomName, ...(S.showDetails ? [sel.category, sel.sku] : [])] : (S.showDetails ? (withSupplier ? [sel.category, sel.sku] : [sel.category, sel.supplier, sel.sku]) : [])).filter(Boolean).join(' · ')) || ''}</p>
          </td>
          ${withSupplier ? `<td style="color:var(--ink-soft)">${esc(sel.supplier) || '—'}</td>` : ''}
          <td style="color:var(--ink-soft)">${esc(spec) || '—'}</td>
          <td style="color:var(--ink-soft)">${sel.qty || 1}</td>
          ${S.showCosts ? `<td style="color:var(--ink-soft)">${sel.cost != null ? money(sel.cost) : '—'}</td>
          <td style="color:var(--ink)" class="font-semibold">${lineTotal != null ? money(lineTotal) : '—'}</td>` : ''}
          ${S.showApproval ? `<td>${approvalHtml}</td>` : ''}
        </tr>`;
    }

    function roomSectionHtml(room) {
      const live = room.selections.filter(s => s.status !== 'rejected');
      if (!live.length) return '';
      const roomTotal = live.reduce((s, sel) => s + (sel.cost || 0) * (sel.qty || 1), 0);
      const hasImages = S.showImages && live.some(s => s.imagePath);
      const rows = live.map(sel => selectionRowHtml(sel, hasImages)).join('');
      return `
        <div class="mb-8 doc-room">
          <div class="flex items-baseline justify-between mb-2 doc-room-head">
            <h2 class="font-display text-lg" style="color:var(--ink)">${esc(room.name)}</h2>
            ${S.showCosts ? `<span class="text-sm" style="color:var(--ink-soft)">${money(roomTotal)}</span>` : ''}
          </div>
          <div class="overflow-x-auto">
            <table class="doc-table w-full" style="min-width:560px">
              ${tableHead(hasImages, S.showSupplierColumn)}
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    // Supplier is free text, so group on a normalised key (case, spacing and punctuation
    // ignored) and label each group with its most common spelling.
    function supplierKey(name) {
      return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function supplierGroups(rooms) {
      const groups = new Map();
      rooms.forEach(room => room.selections.filter(s => s.status !== 'rejected').forEach(sel => {
        const key = supplierKey(sel.supplier);
        if (!groups.has(key)) groups.set(key, { spellings: new Map(), items: [] });
        const g = groups.get(key);
        const label = String(sel.supplier || '').trim().replace(/s+/g, ' ');
        g.spellings.set(label, (g.spellings.get(label) || 0) + 1);
        g.items.push({ sel, roomName: room.name });
      }));
      return [...groups.entries()].map(([key, g]) => ({
        key,
        name: key ? [...g.spellings.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0][0] : 'No supplier',
        items: g.items
      })).sort((a, b) => (!a.key - !b.key) || a.name.localeCompare(b.name));
    }

    function supplierSectionHtml(group) {
      const total = group.items.reduce((s, i) => s + (i.sel.cost || 0) * (i.sel.qty || 1), 0);
      const hasImages = S.showImages && group.items.some(i => i.sel.imagePath);
      const rows = group.items.map(i => selectionRowHtml(i.sel, hasImages, i.roomName)).join('');
      return `
        <div class="mb-8 doc-room">
          <div class="flex items-baseline justify-between mb-2 doc-room-head">
            <h2 class="font-display text-lg" style="color:var(--ink)">${esc(group.name)}</h2>
            ${S.showCosts ? `<span class="text-sm" style="color:var(--ink-soft)">${money(total)}</span>` : ''}
          </div>
          <div class="overflow-x-auto">
            <table class="doc-table w-full" style="min-width:560px">
              ${tableHead(hasImages)}
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    async function load() {
      if (!id) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">No project specified.</p>`;
        return;
      }
      document.getElementById('back-link').href = `/project.html?id=${id}`;
      let project, rooms, revision = null;
      try {
        if (revisionId) {
          revision = await api(`/api/revisions/${revisionId}`);
          project = revision.project;
          rooms = revision.rooms;
        } else {
          project = await api(`/api/projects/${id}`);
          rooms = await api(`/api/projects/${id}/rooms`);
        }
      } catch (e) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">Project not found.</p>`;
        return;
      }
      S = Object.assign(S, project.pdfSettings || {});
      const groupParam = params.get('group');
      bySupplier = groupParam ? groupParam === 'supplier' : S.grouping === 'supplier';
      const grandTotal = rooms.reduce((sum, r) => sum + r.selections.filter(s => s.status !== 'rejected').reduce((s, sel) => s + (sel.cost || 0) * (sel.qty || 1), 0), 0);
      const issued = revision ? new Date(revision.createdAt.replace(' ', 'T') + 'Z') : new Date();
      const today = issued.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
      const sections = (bySupplier ? supplierGroups(rooms).map(supplierSectionHtml) : rooms.map(roomSectionHtml)).filter(Boolean);
      document.getElementById('content').innerHTML = `
        <div class="flex items-start justify-between mb-8 pb-6" style="border-bottom:1px solid var(--line)">
          <div>
            <p class="font-display text-2xl" style="color:var(--ink)">AJ Interiors</p>
            <p class="text-xs" style="color:var(--ink-soft)">${esc(S.headerText || 'FF&E design document')}${bySupplier ? ' · by supplier' : ''}${revision ? ' · ' + esc(revision.label) : ''}</p>
            <p class="text-xs" style="color:var(--ink-soft)">${esc(today)}</p>
          </div>
        </div>
        <h1 class="font-display text-3xl mb-1" style="color:var(--ink)">${esc(project.name)}</h1>
        <p class="text-sm mb-6" style="color:var(--ink-soft)">${project.clientName ? `Prepared for ${esc(project.clientName)}` : ''}</p>
        ${sections.length ? sections.join('') : `<p class="text-sm" style="color:var(--ink-soft)">No selections to show yet.</p>`}
        ${S.showCosts ? `<div class="flex items-center justify-between pt-4 mt-2" style="border-top:1px solid var(--line)">
          <p class="font-display text-lg" style="color:var(--ink)">Document total</p>
          <p class="font-display text-lg" style="color:var(--ink)">${money(grandTotal)}</p>
        </div>` : ''}
      `;
    }

    load();
  </script>
</body>
</html>
