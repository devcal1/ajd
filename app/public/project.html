<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJD — Project</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css">
</head>
<body class="min-h-screen">
  <header class="px-6 py-4 flex items-center justify-between" style="background:#fff; border-bottom:1px solid var(--line)">
    <span class="font-display text-2xl" style="color:var(--ink)">AJD</span>
    <nav class="flex items-center gap-5 text-sm">
      <a href="/" class="nav-link" style="color:var(--ink-soft)">Projects</a>
      <a href="/library.html" class="nav-link" style="color:var(--ink-soft)">Library</a>
      <a href="/settings.html" title="Settings" aria-label="Settings" class="icon-link text-base leading-none">⚙</a>
      <button onclick="logout()" class="btn-ghost px-3 py-1.5 rounded-lg text-sm">Sign out</button>
    </nav>
  </header>
  <main class="p-6 max-w-4xl mx-auto">
    <a href="/" class="text-sm inline-block mb-4" style="color:var(--ink-soft)">&larr; All projects</a>
    <div id="content"></div>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeForm()">
    <div class="card modal-body p-6 w-full max-w-lg">
      <h2 class="font-display text-xl mb-4" style="color:var(--ink)">Edit project</h2>
      <form id="project-form" class="space-y-3">
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Project name *</label>
          <input id="f-name" required class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Client</label>
            <input id="f-client" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Status</label>
            <select id="f-status" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
              <option value="active">Active</option>
              <option value="on hold">On hold</option>
              <option value="complete">Complete</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Budget</label>
          <input id="f-budget" type="number" step="0.01" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Notes</label>
          <textarea id="f-notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)"></textarea>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Cover image</label>
          <div class="flex items-center gap-2 mt-1">
            <input id="f-cover" type="file" accept="image/*" class="sr-only">
            <label for="f-cover" class="btn-ghost px-4 py-2 rounded-lg text-sm cursor-pointer inline-block">Upload image</label>
            <span id="f-cover-name" class="text-xs" style="color:var(--ink-soft)">No file chosen</span>
          </div>
          <label id="f-remove-cover-wrap" class="hidden flex items-center gap-2 text-xs mt-2" style="color:var(--ink-soft)">
            <input type="checkbox" id="f-remove-cover"> Remove current cover image
          </label>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="room-modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeRoomForm()">
    <div class="card modal-body p-6 w-full max-w-sm">
      <h2 id="room-modal-title" class="font-display text-xl mb-4" style="color:var(--ink)">Add room</h2>
      <form id="room-form" class="space-y-3">
        <input type="hidden" id="room-id">
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Room name *</label>
          <input id="f-room-name" required class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)" placeholder="e.g. Living room">
        </div>
        <div class="flex items-center justify-between gap-2 pt-2">
          <button type="button" id="room-delete-btn" onclick="deleteRoomFromModal()" class="btn-ghost px-4 py-2 rounded-lg text-sm hidden" style="color:var(--red)">Delete room</button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeRoomForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
            <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="selection-modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeSelectionForm()">
    <div class="card modal-body p-6 w-full max-w-lg">
      <h2 id="selection-modal-title" class="font-display text-xl mb-4" style="color:var(--ink)">Add selection</h2>
      <form id="selection-form" class="space-y-3">
        <input type="hidden" id="sel-id">
        <input type="hidden" id="sel-room-id">
        <input type="hidden" id="sel-library-item-id">
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Import from library</label>
          <input id="f-sel-import" list="library-items-datalist" placeholder="Search library to prefill..." class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          <datalist id="library-items-datalist"></datalist>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Title *</label>
          <input id="f-sel-title" required class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Category</label>
            <input id="f-sel-category" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Supplier</label>
            <input id="f-sel-supplier" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">SKU</label>
            <input id="f-sel-sku" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Dimensions</label>
            <input id="f-sel-dimensions" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Finish</label>
            <input id="f-sel-finish" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Status</label>
            <select id="f-sel-status" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
              <option value="proposed">Proposed</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Cost (each)</label>
            <input id="f-sel-cost" type="number" step="0.01" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Qty</label>
            <input id="f-sel-qty" type="number" min="1" step="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Notes</label>
          <textarea id="f-sel-notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)"></textarea>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Image</label>
          <div class="flex items-center gap-2 mt-1">
            <input id="f-sel-image" type="file" accept="image/*" class="sr-only">
            <label for="f-sel-image" class="btn-ghost px-4 py-2 rounded-lg text-sm cursor-pointer inline-block">Upload image</label>
            <span id="f-sel-image-name" class="text-xs" style="color:var(--ink-soft)">No file chosen</span>
          </div>
          <label id="f-sel-remove-image-wrap" class="hidden flex items-center gap-2 text-xs mt-2" style="color:var(--ink-soft)">
            <input type="checkbox" id="f-sel-remove-image"> Remove current image
          </label>
        </div>
        <div class="flex items-center justify-between gap-2 pt-2">
          <button type="button" id="sel-delete-btn" onclick="deleteSelectionFromModal()" class="btn-ghost px-4 py-2 rounded-lg text-sm hidden" style="color:var(--red)">Delete</button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeSelectionForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
            <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="sync-modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeSyncModal()">
    <div class="card modal-body p-6 w-full max-w-lg">
      <h2 id="sync-title" class="font-display text-xl mb-2" style="color:var(--ink)"></h2>
      <div id="sync-body" class="text-sm"></div>
      <div id="sync-actions" class="flex items-center justify-end gap-2 flex-wrap pt-4"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/shared.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let project = null;
    let rooms = [];
    let libraryItems = [];

    function statusLabel(s) {
      return { active: 'Active', 'on hold': 'On hold', complete: 'Complete' }[s] || s;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      if (!id) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">No project specified.</p>`;
        return;
      }
      try {
        project = await api(`/api/projects/${id}`);
        await loadRooms();
      } catch (e) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">Project not found.</p>`;
        return;
      }
      render();
    }

    function render() {
      const cover = project.coverImagePath
        ? `<img src="${esc(project.coverImagePath)}" class="w-full" style="aspect-ratio:16/6; object-fit:cover; border-radius:20px 20px 0 0;" alt="">`
        : '';
      document.getElementById('content').innerHTML = `
        <div class="card overflow-hidden mb-5">
          ${cover}
          <div class="p-5">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h1 class="font-display text-3xl mb-1" style="color:var(--ink)">${esc(project.name)}</h1>
                <p class="text-sm" style="color:var(--ink-soft)">${esc(project.clientName) || 'No client set'}</p>
              </div>
              <span class="tag tag-status shrink-0 mt-1.5">${esc(statusLabel(project.status))}${project.archived ? ' · Archived' : ''}</span>
            </div>
            <div class="flex flex-wrap gap-6 mt-4 mb-1">
              ${project.budget != null ? `<div><p class="text-[11px] uppercase tracking-[.08em] font-medium" style="color:var(--ink-soft)">Budget</p><p class="font-display text-xl" style="color:var(--ink)">${money(project.budget)}</p></div>` : ''}
              <div><p class="text-[11px] uppercase tracking-[.08em] font-medium" style="color:var(--ink-soft)">Committed</p><p class="font-display text-xl" style="color:var(--ink)">${money(totalSelectionCost())}</p></div>
              <div><p class="text-[11px] uppercase tracking-[.08em] font-medium" style="color:var(--ink-soft)">Approved</p><p class="font-display text-xl" style="color:var(--ink)">${money(approvedCost())}</p></div>
            </div>
            ${project.notes ? `<p class="text-sm mt-3 whitespace-pre-wrap" style="color:var(--ink)">${esc(project.notes)}</p>` : ''}
            <div class="flex items-center gap-2 flex-wrap mt-4">
              <button onclick="openForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Edit</button>
              <a href="/document-print.html?id=${id}" target="_blank" class="btn-ghost px-4 py-2 rounded-lg text-sm inline-block">Preview document</a>
              <a href="/api/projects/${id}/document.pdf" class="btn-ghost px-4 py-2 rounded-lg text-sm inline-block">Download PDF</a>
              <button onclick="toggleArchive()" class="btn-ghost px-4 py-2 rounded-lg text-sm">${project.archived ? 'Unarchive' : 'Archive'}</button>
              ${project.archived ? `<button onclick="remove()" class="btn-ghost px-4 py-2 rounded-lg text-sm" style="color:var(--red)">Delete</button>` : ''}
            </div>
          </div>
        </div>
        <div class="flex items-center justify-between flex-wrap gap-3 mb-3">
          <div>
            <p class="font-display text-lg mb-1" style="color:var(--ink)">Rooms &amp; selections</p>
            <p class="text-sm" style="color:var(--ink-soft)">${rooms.length} room${rooms.length === 1 ? '' : 's'} · ${totalSelectionCount()} selection${totalSelectionCount() === 1 ? '' : 's'}</p>
          </div>
          <button onclick="openRoomForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">+ Add room</button>
        </div>
        <div id="rooms" class="space-y-4"></div>
      `;
      renderRooms();
    }

    function totalSelectionCount() {
      return rooms.reduce((n, r) => n + r.selections.length, 0);
    }

    function totalSelectionCost() {
      return rooms.reduce((sum, r) => sum + r.selections.reduce((s, sel) => s + (sel.cost || 0) * (sel.qty || 1), 0), 0);
    }

    function approvedCost() {
      return rooms.reduce((sum, r) => sum + r.selections.filter(s => s.status === 'approved').reduce((s, sel) => s + (sel.cost || 0) * (sel.qty || 1), 0), 0);
    }

    function statusTagClass(s) {
      return { proposed: 'tag-proposed', approved: 'tag-approved', rejected: 'tag-rejected' }[s] || 'tag-proposed';
    }

    function statusLabelSel(s) {
      return { proposed: 'Proposed', approved: 'Approved', rejected: 'Rejected' }[s] || s;
    }

    function roomCardHtml(room) {
      const roomTotal = room.selections.reduce((s, sel) => s + (sel.cost || 0) * (sel.qty || 1), 0);
      const rows = room.selections.length
        ? room.selections.map(sel => selectionRowHtml(room, sel)).join('')
        : `<p class="text-sm py-3" style="color:var(--ink-soft)">No selections yet.</p>`;
      return `
        <div class="card p-4">
          <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
            <div class="flex flex-col sm:flex-row sm:items-center sm:gap-2">
              <p class="font-display text-xl" style="color:var(--ink)">${esc(room.name)}</p>
              <span class="text-xs block sm:inline sm:ml-2" style="color:var(--ink-soft)">${room.selections.length} item${room.selections.length === 1 ? '' : 's'} · ${money(roomTotal)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openSelectionForm(${room.id})" class="btn-ghost px-3 py-1 rounded-lg text-xs">+ Add selection</button>
              <button onclick="openRoomForm(${room.id})" class="btn-ghost px-3 py-1 rounded-lg text-xs">Rename</button>
            </div>
          </div>
          <div class="divide-y" style="border-color:var(--line)">${rows}</div>
        </div>`;
    }

    function selectionRowHtml(room, sel) {
      const thumb = sel.imagePath
        ? `<img src="${esc(sel.imagePath)}" class="sel-thumb" alt="">`
        : `<div class="sel-thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;
      const meta = [sel.category, sel.supplier, sel.dimensions, sel.finish].filter(Boolean).join(' · ');
      return `
        <div class="flex items-start gap-3 py-2.5">
          ${thumb}
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="font-semibold text-sm" style="color:var(--ink)">${esc(sel.title)}</p>
              <span class="tag ${statusTagClass(sel.status)}">${statusLabelSel(sel.status)}</span>
              ${sel.libraryStatus === 'changed' ? `<button onclick="openSyncModal(${room.id}, ${sel.id})" class="tag" style="cursor:pointer" title="The library item has changed since this was added">Library updated</button>` : ''}
              ${sel.libraryStatus === 'removed' ? `<button onclick="openSyncModal(${room.id}, ${sel.id})" class="tag" style="cursor:pointer" title="The library item was deleted">Library item deleted</button>` : ''}
            </div>
            <p class="text-xs truncate" style="color:var(--ink-soft)">${esc(meta) || '&nbsp;'}</p>
            ${sel.notes ? `<p class="text-xs italic truncate" style="color:var(--ink-soft)">${esc(sel.notes)}</p>` : ''}
            <div class="flex items-center justify-between flex-wrap gap-2 mt-1.5">
              <span class="text-sm" style="color:var(--ink-soft)">
                ${sel.qty > 1 ? `${sel.qty} × ` : ''}${sel.cost != null ? money(sel.cost) : '—'}
              </span>
              <div class="flex items-center gap-1">
                <button onclick="openSelectionForm(${room.id}, ${sel.id})" class="btn-ghost px-3 py-1 rounded-lg text-xs">Edit</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderRooms() {
      const el = document.getElementById('rooms');
      if (!el) return;
      el.innerHTML = rooms.length
        ? rooms.map(roomCardHtml).join('')
        : `<div class="card p-5 text-center" style="color:var(--ink-soft)">
             <p class="text-sm mb-3">No rooms yet. Add a room to start the FF&amp;E selection schedule.</p>
             <button onclick="openRoomForm()" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">+ Add room</button>
           </div>`;
    }

    async function loadRooms() {
      rooms = await api(`/api/projects/${id}/rooms`);
    }

    function openForm() {
      document.getElementById('f-name').value = project.name || '';
      document.getElementById('f-client').value = project.clientName || '';
      document.getElementById('f-status').value = project.status || 'active';
      document.getElementById('f-budget').value = project.budget == null ? '' : project.budget;
      document.getElementById('f-notes').value = project.notes || '';
      document.getElementById('f-cover').value = '';
      document.getElementById('f-cover-name').textContent = 'No file chosen';
      document.getElementById('f-remove-cover-wrap').classList.toggle('hidden', !project.coverImagePath);
      document.getElementById('f-remove-cover').checked = false;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('name', document.getElementById('f-name').value);
      fd.append('clientName', document.getElementById('f-client').value);
      fd.append('status', document.getElementById('f-status').value);
      fd.append('budget', document.getElementById('f-budget').value);
      fd.append('notes', document.getElementById('f-notes').value);
      const file = document.getElementById('f-cover').files[0];
      if (file) fd.append('coverImage', file);
      if (document.getElementById('f-remove-cover').checked) fd.append('removeCoverImage', 'true');

      const res = await fetch(`/api/projects/${id}`, { method: 'PUT', body: fd });
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        toast(body.error || 'Save failed');
        return;
      }
      closeForm();
      toast('Project saved');
      load();
    });

    async function toggleArchive() {
      await api(`/api/projects/${id}/archive`, {
        method: 'POST',
        body: JSON.stringify({ archive: !project.archived })
      });
      toast(project.archived ? 'Project unarchived' : 'Project archived');
      load();
    }

    async function remove() {
      if (!confirm('Permanently delete this project? This cannot be undone.')) return;
      await api(`/api/projects/${id}`, { method: 'DELETE' });
      toast('Project deleted');
      window.location.href = '/';
    }

    async function refreshRooms() {
      await loadRooms();
      render();
    }

    function openRoomForm(roomId) {
      const form = document.getElementById('room-form');
      form.reset();
      document.getElementById('room-id').value = roomId || '';
      document.getElementById('room-delete-btn').classList.toggle('hidden', !roomId);
      document.getElementById('room-modal-title').textContent = roomId ? 'Rename room' : 'Add room';
      if (roomId) {
        const room = rooms.find(r => r.id === roomId);
        if (room) document.getElementById('f-room-name').value = room.name;
      }
      document.getElementById('room-modal-backdrop').classList.remove('hidden');
    }

    function closeRoomForm() {
      document.getElementById('room-modal-backdrop').classList.add('hidden');
    }

    document.getElementById('room-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const roomId = document.getElementById('room-id').value;
      const name = document.getElementById('f-room-name').value;
      try {
        if (roomId) {
          await api(`/api/rooms/${roomId}`, { method: 'PUT', body: JSON.stringify({ name }) });
        } else {
          await api(`/api/projects/${id}/rooms`, { method: 'POST', body: JSON.stringify({ name }) });
        }
      } catch (err) {
        toast(err.message || 'Save failed');
        return;
      }
      closeRoomForm();
      toast('Room saved');
      refreshRooms();
    });

    async function removeRoom(roomId) {
      if (!confirm('Delete this room and all of its selections? This cannot be undone.')) return;
      await api(`/api/rooms/${roomId}`, { method: 'DELETE' });
      toast('Room deleted');
      refreshRooms();
    }

    function deleteRoomFromModal() {
      const roomId = document.getElementById('room-id').value;
      if (!roomId) return;
      closeRoomForm();
      removeRoom(Number(roomId));
    }

    async function openSelectionForm(roomId, selId) {
      const form = document.getElementById('selection-form');
      form.reset();
      document.getElementById('sel-id').value = selId || '';
      document.getElementById('sel-room-id').value = roomId;
      document.getElementById('sel-library-item-id').value = '';
      document.getElementById('f-sel-import').value = '';
      document.getElementById('f-sel-status').value = 'proposed';
      document.getElementById('f-sel-qty').value = '1';
      document.getElementById('f-sel-remove-image-wrap').classList.add('hidden');
      document.getElementById('f-sel-image-name').textContent = 'No file chosen';
      document.getElementById('sel-delete-btn').classList.toggle('hidden', !selId);
      document.getElementById('selection-modal-title').textContent = selId ? 'Edit selection' : 'Add selection';
      if (selId) {
        const room = rooms.find(r => r.id === roomId);
        const sel = room && room.selections.find(s => s.id === selId);
        if (sel) {
          document.getElementById('f-sel-title').value = sel.title || '';
          document.getElementById('f-sel-category').value = sel.category || '';
          document.getElementById('f-sel-supplier').value = sel.supplier || '';
          document.getElementById('f-sel-sku').value = sel.sku || '';
          document.getElementById('f-sel-dimensions').value = sel.dimensions || '';
          document.getElementById('f-sel-finish').value = sel.finish || '';
          document.getElementById('f-sel-status').value = sel.status || 'proposed';
          document.getElementById('f-sel-cost').value = sel.cost == null ? '' : sel.cost;
          document.getElementById('f-sel-qty').value = sel.qty || 1;
          document.getElementById('f-sel-notes').value = sel.notes || '';
          document.getElementById('sel-library-item-id').value = sel.libraryItemId || '';
          if (sel.imagePath) document.getElementById('f-sel-remove-image-wrap').classList.remove('hidden');
        }
      }
      document.getElementById('selection-modal-backdrop').classList.remove('hidden');
      loadLibraryItemsForImport();
    }

    function closeSelectionForm() {
      document.getElementById('selection-modal-backdrop').classList.add('hidden');
    }

    async function loadLibraryItemsForImport() {
      try {
        libraryItems = await api('/api/library');
      } catch (e) {
        libraryItems = [];
      }
      document.getElementById('library-items-datalist').innerHTML =
        libraryItems.map(it => `<option value="${esc(it.title)}">`).join('');
    }

    document.getElementById('f-sel-import').addEventListener('change', (e) => {
      const match = libraryItems.find(it => it.title === e.target.value);
      if (!match) return;
      document.getElementById('f-sel-title').value = match.title || '';
      document.getElementById('f-sel-category').value = match.category || '';
      document.getElementById('f-sel-supplier').value = match.supplier || '';
      document.getElementById('f-sel-sku').value = match.sku || '';
      document.getElementById('f-sel-dimensions').value = match.dimensions || '';
      document.getElementById('f-sel-finish').value = match.finish || '';
      document.getElementById('f-sel-cost').value = match.cost == null ? '' : match.cost;
      document.getElementById('sel-library-item-id').value = match.id;
    });

    document.getElementById('selection-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selId = document.getElementById('sel-id').value;
      const roomId = document.getElementById('sel-room-id').value;
      const fd = new FormData();
      fd.append('title', document.getElementById('f-sel-title').value);
      fd.append('category', document.getElementById('f-sel-category').value);
      fd.append('supplier', document.getElementById('f-sel-supplier').value);
      fd.append('sku', document.getElementById('f-sel-sku').value);
      fd.append('dimensions', document.getElementById('f-sel-dimensions').value);
      fd.append('finish', document.getElementById('f-sel-finish').value);
      fd.append('status', document.getElementById('f-sel-status').value);
      fd.append('cost', document.getElementById('f-sel-cost').value);
      fd.append('qty', document.getElementById('f-sel-qty').value);
      fd.append('notes', document.getElementById('f-sel-notes').value);
      const libraryItemId = document.getElementById('sel-library-item-id').value;
      if (libraryItemId) fd.append('libraryItemId', libraryItemId);
      const file = document.getElementById('f-sel-image').files[0];
      if (file) fd.append('image', file);
      if (document.getElementById('f-sel-remove-image').checked) fd.append('removeImage', 'true');

      const res = await fetch(selId ? `/api/selections/${selId}` : `/api/rooms/${roomId}/selections`, {
        method: selId ? 'PUT' : 'POST',
        body: fd
      });
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        toast(body.error || 'Save failed');
        return;
      }
      closeSelectionForm();
      toast('Selection saved');
      refreshRooms();
    });

    function syncValue(field, v) {
      if (v == null || v === '') return '<em>empty</em>';
      return field === 'cost' ? esc(money(v)) : esc(v);
    }

    function closeSyncModal() {
      document.getElementById('sync-modal-backdrop').classList.add('hidden');
    }

    function openSyncModal(roomId, selId) {
      const room = rooms.find(r => r.id === roomId);
      const sel = room && room.selections.find(s => s.id === selId);
      if (!sel) return;
      const title = document.getElementById('sync-title');
      const body = document.getElementById('sync-body');
      const actions = document.getElementById('sync-actions');
      const btn = (label, cls, fn) => `<button type="button" onclick="${fn}" class="${cls} px-4 py-2 rounded-lg text-sm ${cls === 'btn-primary' ? 'font-semibold' : ''}">${label}</button>`;
      if (sel.libraryStatus === 'removed') {
        title.textContent = 'Library item deleted';
        body.innerHTML = `<p style="color:var(--ink-soft)">The product library item "${esc(sel.title)}" was copied from has since been deleted. This selection keeps all of its own details, so nothing here needs to change. Dismiss to remove the notice.</p>`;
        actions.innerHTML = btn('Cancel', 'btn-ghost', 'closeSyncModal()') + btn('Dismiss notice', 'btn-primary', `resolveSync(${sel.id}, 'dismiss')`);
      } else {
        title.textContent = 'Update from library';
        const rows = sel.libraryDiff.map(d => d.field === 'image'
          ? `<tr><td class="py-1 pr-3 font-semibold align-top">${esc(d.label)}</td><td class="py-1" colspan="2">${d.library ? 'The library photo has changed. It will <strong>replace</strong> this selection\'s photo.' : 'The library photo was removed. This selection\'s photo will be <strong>removed</strong>.'}</td></tr>`
          : `<tr><td class="py-1 pr-3 font-semibold align-top">${esc(d.label)}</td><td class="py-1 pr-3" style="color:var(--ink-soft)">${syncValue(d.field, d.mine)}</td><td class="py-1">&rarr; <strong>${syncValue(d.field, d.library)}</strong></td></tr>`).join('');
        body.innerHTML = `
          <p class="mb-3" style="color:var(--ink-soft)">The library item for "${esc(sel.title)}" has been edited since it was added to this project. Updating will overwrite this selection's details with the library's:</p>
          ${rows ? `<table class="w-full mb-3"><thead><tr class="text-left text-xs" style="color:var(--ink-soft)"><th class="pr-3 font-medium">Field</th><th class="pr-3 font-medium">Now in this project</th><th class="font-medium">Will become</th></tr></thead><tbody>${rows}</tbody></table>`
                 : `<p class="mb-3">None of this selection's details differ from the library, so nothing visible would change.</p>`}
          <p style="color:var(--ink-soft)">Not changed: quantity, status and notes. Choose <strong>Keep mine</strong> to leave this selection as it is and clear the warning until the library changes again.</p>`;
        actions.innerHTML = btn('Cancel', 'btn-ghost', 'closeSyncModal()') + btn('Keep mine', 'btn-ghost', `resolveSync(${sel.id}, 'keep')`) + btn('Update from library', 'btn-primary', `resolveSync(${sel.id}, 'update')`);
      }
      document.getElementById('sync-modal-backdrop').classList.remove('hidden');
    }

    async function resolveSync(selId, action) {
      try {
        await api(`/api/selections/${selId}/library-sync`, { method: 'POST', body: JSON.stringify({ action }) });
      } catch (err) {
        toast(err.message || 'Update failed');
        return;
      }
      closeSyncModal();
      toast(action === 'update' ? 'Updated from library' : action === 'keep' ? 'Kept as is' : 'Notice dismissed');
      refreshRooms();
    }

    async function removeSelection(selId) {
      if (!confirm('Delete this selection? This cannot be undone.')) return;
      await api(`/api/selections/${selId}`, { method: 'DELETE' });
      toast('Selection deleted');
      refreshRooms();
    }

    function deleteSelectionFromModal() {
      const selId = document.getElementById('sel-id').value;
      if (!selId) return;
      closeSelectionForm();
      removeSelection(Number(selId));
    }

    document.getElementById('f-cover').addEventListener('change', (e) => {
      document.getElementById('f-cover-name').textContent = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
    });

    document.getElementById('f-sel-image').addEventListener('change', (e) => {
      document.getElementById('f-sel-image-name').textContent = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
    });

    load();
  </script>
</body>
</html>
