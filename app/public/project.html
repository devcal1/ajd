<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJD — Project</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css">
</head>
<body class="min-h-screen">
  <header class="px-6 py-4 flex items-center justify-between" style="background:#fff; border-bottom:1px solid var(--line)">
    <span class="font-display text-2xl" style="color:var(--ink)">AJD</span>
    <nav class="flex items-center gap-5 text-sm">
      <a href="/" class="nav-link" style="color:var(--ink-soft)">Projects</a>
      <a href="/library.html" class="nav-link" style="color:var(--ink-soft)">Library</a>
      <button onclick="logout()" class="btn-ghost px-3 py-1.5 rounded-lg text-sm">Sign out</button>
    </nav>
  </header>
  <main class="p-6 max-w-4xl mx-auto">
    <a href="/" class="text-sm inline-block mb-4" style="color:var(--ink-soft)">&larr; All projects</a>
    <div id="content"></div>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeForm()">
    <div class="card modal-body p-6 w-full max-w-lg">
      <h2 class="font-display text-xl mb-4" style="color:var(--ink)">Edit project</h2>
      <form id="project-form" class="space-y-3">
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Project name *</label>
          <input id="f-name" required class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Client</label>
            <input id="f-client" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
          </div>
          <div>
            <label class="text-xs font-semibold" style="color:var(--ink-soft)">Status</label>
            <select id="f-status" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
              <option value="active">Active</option>
              <option value="on hold">On hold</option>
              <option value="complete">Complete</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Budget</label>
          <input id="f-budget" type="number" step="0.01" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)">
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Notes</label>
          <textarea id="f-notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" style="border-color:var(--line)"></textarea>
        </div>
        <div>
          <label class="text-xs font-semibold" style="color:var(--ink-soft)">Cover image</label>
          <input id="f-cover" type="file" accept="image/*" class="w-full text-sm">
          <label id="f-remove-cover-wrap" class="hidden flex items-center gap-2 text-xs mt-1" style="color:var(--ink-soft)">
            <input type="checkbox" id="f-remove-cover"> Remove current cover image
          </label>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/js/shared.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let project = null;

    function statusLabel(s) {
      return { active: 'Active', 'on hold': 'On hold', complete: 'Complete' }[s] || s;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      if (!id) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">No project specified.</p>`;
        return;
      }
      try {
        project = await api(`/api/projects/${id}`);
      } catch (e) {
        document.getElementById('content').innerHTML = `<p style="color:var(--ink-soft)">Project not found.</p>`;
        return;
      }
      render();
    }

    function render() {
      const cover = project.coverImagePath
        ? `<img src="${esc(project.coverImagePath)}" class="w-full" style="aspect-ratio:16/6; object-fit:cover; border-radius:20px 20px 0 0;" alt="">`
        : '';
      document.getElementById('content').innerHTML = `
        <div class="card overflow-hidden mb-5">
          ${cover}
          <div class="p-5">
            <div class="flex items-start justify-between flex-wrap gap-3">
              <div>
                <h1 class="font-display text-3xl mb-1" style="color:var(--ink)">${esc(project.name)}</h1>
                <p class="text-sm" style="color:var(--ink-soft)">${esc(project.clientName) || 'No client set'}</p>
              </div>
              <span class="tag tag-status">${esc(statusLabel(project.status))}${project.archived ? ' · Archived' : ''}</span>
            </div>
            ${project.budget != null ? `<p class="text-sm mt-3" style="color:var(--ink-soft)">Budget: ${money(project.budget)}</p>` : ''}
            ${project.notes ? `<p class="text-sm mt-3 whitespace-pre-wrap" style="color:var(--ink)">${esc(project.notes)}</p>` : ''}
            <div class="flex items-center gap-2 flex-wrap mt-4">
              <button onclick="openForm()" class="btn-ghost px-4 py-2 rounded-lg text-sm">Edit</button>
              <button onclick="toggleArchive()" class="btn-ghost px-4 py-2 rounded-lg text-sm">${project.archived ? 'Unarchive' : 'Archive'}</button>
              ${project.archived ? `<button onclick="remove()" class="btn-ghost px-4 py-2 rounded-lg text-sm" style="color:var(--red)">Delete</button>` : ''}
            </div>
          </div>
        </div>
        <div class="card p-5" style="color:var(--ink-soft)">
          <p class="font-display text-lg mb-1" style="color:var(--ink)">Rooms &amp; selections</p>
          <p class="text-sm">The room-by-room FF&amp;E selection schedule lands in Stage 4.</p>
        </div>
      `;
    }

    function openForm() {
      document.getElementById('f-name').value = project.name || '';
      document.getElementById('f-client').value = project.clientName || '';
      document.getElementById('f-status').value = project.status || 'active';
      document.getElementById('f-budget').value = project.budget == null ? '' : project.budget;
      document.getElementById('f-notes').value = project.notes || '';
      document.getElementById('f-cover').value = '';
      document.getElementById('f-remove-cover-wrap').classList.toggle('hidden', !project.coverImagePath);
      document.getElementById('f-remove-cover').checked = false;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('name', document.getElementById('f-name').value);
      fd.append('clientName', document.getElementById('f-client').value);
      fd.append('status', document.getElementById('f-status').value);
      fd.append('budget', document.getElementById('f-budget').value);
      fd.append('notes', document.getElementById('f-notes').value);
      const file = document.getElementById('f-cover').files[0];
      if (file) fd.append('coverImage', file);
      if (document.getElementById('f-remove-cover').checked) fd.append('removeCoverImage', 'true');

      const res = await fetch(`/api/projects/${id}`, { method: 'PUT', body: fd });
      if (res.status === 401) { window.location.href = '/login.html'; return; }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        toast(body.error || 'Save failed');
        return;
      }
      closeForm();
      toast('Project saved');
      load();
    });

    async function toggleArchive() {
      await api(`/api/projects/${id}/archive`, {
        method: 'POST',
        body: JSON.stringify({ archive: !project.archived })
      });
      toast(project.archived ? 'Project unarchived' : 'Project archived');
      load();
    }

    async function remove() {
      if (!confirm('Permanently delete this project? This cannot be undone.')) return;
      await api(`/api/projects/${id}`, { method: 'DELETE' });
      toast('Project deleted');
      window.location.href = '/';
    }

    load();
  </script>
</body>
</html>
