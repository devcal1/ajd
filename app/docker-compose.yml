# Local dev/test compose file only — NOT the Umbrel packaging (that lives in
# the tenon-ajd-design-manager app in devcal1/tenon-umbrel-store, and uses the
# app_proxy convention).
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      # Scheduled local backups (src/backup.js) -- snapshots land under
      # ./data/backups, so they're already inside the volume below. BACKUP_HOUR
      # is a 24h local-time hour (needs TZ set to mean anything but UTC).
      TZ: ${TZ:-Australia/Sydney}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
